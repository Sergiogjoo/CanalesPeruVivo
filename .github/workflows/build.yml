name: Build APK Firmado

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.2
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ls -la release.keystore

      - name: Compilar APK Release firmado
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/CanalesPeruVivo-v1.0-firmado.apk

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: CanalesPeruVivo-FIRMADO
          path: salida/CanalesPeruVivo-v1.0-firmado.apk

      - name: Crear Release en GitHub
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Canales Perú Vivo v1.0 (build ${{ github.run_number }})"
          files: salida/CanalesPeruVivo-v1.0-firmado.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
